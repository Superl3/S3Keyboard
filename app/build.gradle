plugins {
    id "com.android.application"
}

def releaseVersionCode = providers.gradleProperty("S3_VERSION_CODE").orElse("1")
def releaseVersionName = providers.gradleProperty("S3_VERSION_NAME").orElse("0.1.0")

android {
    namespace "com.superl3.s3keyboard"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.superl3.s3keyboard"
        minSdk 23
        targetSdk 35
        versionCode releaseVersionCode.get().toInteger()
        versionName releaseVersionName.get()
        buildConfigField "String", "GIT_COMMIT", "\"${gitShortCommit()}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTimestamp()}\""
    }

    signingConfigs {
        closedBeta {
            def keystorePath = providers.gradleProperty("HANGUL_IME_KEYSTORE").orNull
            def keystorePassword = providers.gradleProperty("HANGUL_IME_KEYSTORE_PASSWORD").orNull
            def keyAliasValue = providers.gradleProperty("HANGUL_IME_KEY_ALIAS").orNull
            def keyPasswordValue = providers.gradleProperty("HANGUL_IME_KEY_PASSWORD").orNull
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingConfigs.closedBeta.storeFile != null) {
                signingConfig signingConfigs.closedBeta
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDir "$buildDir/generated/source/themePresets/java"
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

def generatedThemePresetDir = file("$buildDir/generated/source/themePresets/java")

tasks.register("generateThemePresets", Exec) {
    workingDir rootProject.projectDir
    inputs.files(fileTree(dir: rootProject.file("themes"), include: "*.json"))
    inputs.file(rootProject.file("tools/sync-themes.mjs"))
    inputs.file(rootProject.file("tools/theme-contract.mjs"))
    outputs.dir(generatedThemePresetDir)
    commandLine "node", "tools/sync-themes.mjs", "--generate-java", generatedThemePresetDir.absolutePath
}

tasks.named("preBuild") {
    dependsOn tasks.named("generateThemePresets")
}

tasks.register("verifyClosedBetaSigning") {
    doLast {
        def requiredProperties = [
                "HANGUL_IME_KEYSTORE",
                "HANGUL_IME_KEYSTORE_PASSWORD",
                "HANGUL_IME_KEY_ALIAS",
                "HANGUL_IME_KEY_PASSWORD"
        ]
        def missing = requiredProperties.findAll {
            !providers.gradleProperty(it).isPresent()
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing closed-beta signing properties: ${missing.join(', ')}")
        }
        def keystore = file(providers.gradleProperty("HANGUL_IME_KEYSTORE").get())
        if (!keystore.isFile()) {
            throw new GradleException("Closed-beta keystore does not exist: ${keystore}")
        }
    }
}

tasks.matching { it.name == "assembleRelease" }.configureEach {
    dependsOn tasks.named("verifyClosedBetaSigning")
}

def gitShortCommit() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine "git", "rev-parse", "--short", "HEAD"
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

def buildTimestamp() {
    return new Date().format("yyyy-MM-dd'T'HH:mm:ssZ", java.util.TimeZone.getTimeZone("UTC"))
}
