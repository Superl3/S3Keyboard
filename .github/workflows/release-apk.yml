name: Installable APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build installable beta APK
        shell: bash
        run: |
          chmod +x ./gradlew
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleDebug -PS3_VERSION_NAME="$VERSION_NAME" -PS3_VERSION_CODE="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/new-dingul-${VERSION_NAME}-installable.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-dingul-installable-apk
          path: dist/*.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.apk
          body: |
            Installable beta build signed with the Android debug key.
            See docs/visual-showcase.md and docs/feature-catalog.md for the current feature set.
            Production/Play signing remains separate and requires the closed-beta keystore.
